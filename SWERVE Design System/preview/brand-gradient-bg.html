<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; font-family: var(--font-body); padding: 0; overflow: hidden; height: 200px; position: relative; }
.grad-bg { position: absolute; inset: 0; background: url('../assets/gradient-bg.png') center/cover; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 32px; gap: 4px; }
.mark { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); opacity: 0.18; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
.headline { font-size: 40px; font-weight: 900; color: #fff; letter-spacing: -0.03em; line-height: 1; }
</style>
</head><body>
  <div class="grad-bg"></div>
  <div class="overlay">
    <div class="eyebrow">Move different</div>
    <div class="headline">SWERVE</div>
    <div class="mark"><img src="../assets/watermark-white.png" height="100"></div>
  </div>
</body></html>
