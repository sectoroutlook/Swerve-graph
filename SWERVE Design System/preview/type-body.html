<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); font-family: var(--font-body); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: baseline; gap: 14px; }
.meta { font-size: 10px; color: var(--fg3); min-width: 120px; white-space: nowrap; }
</style>
</head><body>
  <div class="row"><div class="meta">20px / Medium</div><div style="font-size:20px;font-weight:500;color:var(--fg1)">Section heading</div></div>
  <div class="row"><div class="meta">17px / Medium</div><div style="font-size:17px;font-weight:500;color:var(--fg1)">Dashboard label</div></div>
  <div class="row"><div class="meta">15px / Regular</div><div style="font-size:15px;font-weight:400;color:var(--fg2);line-height:1.65">Body copy for research summaries and descriptions. Clear, scannable, minimal.</div></div>
  <div class="row"><div class="meta">13px / Regular</div><div style="font-size:13px;font-weight:400;color:var(--fg3)">Caption, tooltip, table metadata</div></div>
  <div class="row"><div class="meta">11px / Medium + CAPS</div><div style="font-size:11px;font-weight:500;color:var(--fg3);letter-spacing:0.1em;text-transform:uppercase">Overline — Region · Sector</div></div>
</body></html>
