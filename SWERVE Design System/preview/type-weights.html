<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); font-family: var(--font-body); padding: 20px; display: flex; flex-direction: column; gap: 9px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }
.specimen { font-size: 16px; color: var(--fg1); }
.meta { font-size: 10px; color: var(--fg3); text-align: right; }
.usage { font-size: 10px; color: rgba(24,146,243,0.8); text-align: right; margin-top: 1px; }
</style>
</head><body>
  <div class="row"><div class="specimen" style="font-weight:700">Poppins Bold</div><div><div class="meta">700</div><div class="usage">H1, page titles, key moments</div></div></div>
  <div class="row"><div class="specimen" style="font-weight:600">Poppins SemiBold</div><div><div class="meta">600</div><div class="usage">Subheadings, emphasis</div></div></div>
  <div class="row"><div class="specimen" style="font-weight:500">Poppins Medium</div><div><div class="meta">500</div><div class="usage">Subheaders, labels, menus</div></div></div>
  <div class="row"><div class="specimen" style="font-weight:400">Poppins Regular</div><div><div class="meta">400</div><div class="usage">Body text, captions, tooltips</div></div></div>
  <div class="row"><div class="specimen" style="font-weight:300;color:var(--fg2)">Poppins Light</div><div><div class="meta">300</div><div class="usage">Form hints (sparingly)</div></div></div>
</body></html>
