<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); font-family: var(--font-body); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.grad { border-radius: 10px; height: 56px; display: flex; align-items: center; padding: 0 16px; }
.label { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.9); }
.sub { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }
</style>
</head><body>
  <div class="grad" style="background: linear-gradient(to right, #9666e3, #1892f3)">
    <div><div class="label">Brand — Light Mode</div><div class="sub">Left→Right · Core Purple → Primary Blue</div></div>
  </div>
  <div class="grad" style="background: linear-gradient(to right, #d1c4fc, #9666e3, #1892f3, #cfe6fa)">
    <div><div class="label">Hero / Splash</div><div class="sub">Soft Purple → Core Purple → Blue → Soft Blue</div></div>
  </div>
  <div class="grad" style="background: linear-gradient(135deg, #0e0d11 0%, #aa7bff 40%, #6bd6ff 75%, #e3cfff 100%)">
    <div><div class="label">Dark Mode Gradient</div><div class="sub">Infra Shadow → Synth Purple → Pulse Blue → Ghost Lilac</div></div>
  </div>
</body></html>
