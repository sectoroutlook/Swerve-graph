<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); font-family: var(--font-body); padding: 24px 24px 16px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: baseline; gap: 14px; }
.specimen { font-family: var(--font-display); font-weight: 700; color: var(--fg1); line-height: 1.1; letter-spacing: -0.03em; }
.meta { font-size: 10px; color: var(--fg3); white-space: nowrap; min-width: 110px; }
</style>
</head><body>
  <div class="row"><div class="meta">52px / Bold</div><div class="specimen" style="font-size:52px">SWERVE</div></div>
  <div class="row"><div class="meta">40px / Bold</div><div class="specimen" style="font-size:40px">Emerging Markets</div></div>
  <div class="row"><div class="meta">32px / Bold</div><div class="specimen" style="font-size:32px">Institutional Research</div></div>
  <div class="row"><div class="meta">24px / Bold</div><div class="specimen" style="font-size:24px">Finance, redesigned.</div></div>
</body></html>
