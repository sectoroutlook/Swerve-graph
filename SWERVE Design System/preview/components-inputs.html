<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); font-family: var(--font-body); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.field-wrap { display: flex; flex-direction: column; gap: 5px; }
.label { font-size: 11px; font-weight: 600; color: var(--fg2); letter-spacing: 0.04em; }
input, select {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg1);
  font-family: var(--font-body);
  font-size: 14px;
  padding: 10px 14px;
  outline: none;
  width: 280px;
  transition: border-color 200ms;
}
input::placeholder { color: var(--fg3); }
input:focus { border-color: #a78bfa; box-shadow: 0 0 0 3px rgba(167,139,250,0.15); }
</style>
</head><body>
  <div class="field-wrap">
    <div class="label">Default</div>
    <input type="text" placeholder="Enter your name">
  </div>
  <div class="field-wrap">
    <div class="label">Focused</div>
    <input type="text" value="Active input state" style="border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,0.15)">
  </div>
  <div class="field-wrap">
    <div class="label">Error</div>
    <input type="text" value="Invalid entry" style="border-color:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,0.12)">
  </div>
</body></html>
