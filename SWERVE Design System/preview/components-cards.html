<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); font-family: var(--font-body); padding: 20px; display: flex; gap: 14px; align-items: flex-start; }
.card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px; padding: 18px; width: 180px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--fg1); margin-bottom: 4px; }
.card-sub { font-size: 11px; color: var(--fg3); line-height: 1.5; }
.card-glow { background: var(--bg-elevated); border: 1px solid transparent; border-radius: 14px; padding: 18px; width: 180px;
  background-clip: padding-box;
  position: relative; }
.card-glow::before { content: ''; position: absolute; inset: -1px; border-radius: 15px; background: linear-gradient(135deg,#a78bfa,#4d9ef5); z-index: -1; }
.card-dark { background: #0d0d0d; border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 18px; width: 180px; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
.badge { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; padding: 3px 10px; border-radius: 9999px; margin-bottom: 8px; }
.badge-blue { background: rgba(77,158,245,0.15); color: #93c5fd; border: 1px solid rgba(77,158,245,0.25); }
</style>
</head><body>
  <div class="card">
    <span class="badge badge-blue">NEW</span>
    <div class="card-title">Default Card</div>
    <div class="card-sub">Elevated surface, subtle border, 14px radius.</div>
  </div>
  <div class="card-glow">
    <div class="card-title" style="color:#fff">Gradient Border</div>
    <div class="card-sub">Brand gradient ring on hover or featured state.</div>
  </div>
  <div class="card-dark">
    <div class="card-title" style="color:#fff">Deep Dark</div>
    <div class="card-sub">Full dark with strong shadow — for hero zones.</div>
  </div>
</body></html>
