<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); font-family: var(--font-body); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.lbl { font-size: 10px; color: var(--fg3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
.btn { border: none; cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 600; border-radius: 8px; transition: all 200ms cubic-bezier(0.4,0,0.2,1); }
.btn-primary { background: linear-gradient(to right,#9666e3,#1892f3); color: #fff; padding: 11px 24px; font-size: 14px; }
.btn-primary:hover { opacity: 0.86; transform: translateY(-1px); }
.btn-secondary { background: rgba(255,255,255,0.07); color: #f3f1f3; padding: 11px 24px; font-size: 14px; border: 1px solid rgba(255,255,255,0.12); }
.btn-secondary:hover { background: rgba(255,255,255,0.12); }
.btn-ghost { background: transparent; color: #9666e3; padding: 11px 24px; font-size: 14px; border: 1px solid #9666e3; }
.btn-ghost:hover { background: rgba(150,102,227,0.1); }
.btn-sm { padding: 7px 16px; font-size: 12px; }
.btn-lg { padding: 14px 32px; font-size: 15px; border-radius: 10px; }
</style>
</head><body>
  <div>
    <div class="lbl">Sizes</div>
    <div class="row">
      <button class="btn btn-primary btn-sm">Small</button>
      <button class="btn btn-primary">Default</button>
      <button class="btn btn-primary btn-lg">Large</button>
    </div>
  </div>
  <div>
    <div class="lbl">Variants</div>
    <div class="row">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-ghost">Ghost</button>
    </div>
  </div>
</body></html>
