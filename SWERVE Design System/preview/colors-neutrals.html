<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); font-family: var(--font-body); padding: 20px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { flex: 1; min-width: 70px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.07); }
.swatch-color { height: 52px; }
.swatch-label { padding: 5px 7px; }
.name { font-size: 10px; font-weight: 600; color: var(--fg1); }
.hex  { font-size: 9px; color: var(--fg3); }
</style>
</head><body>
<div class="row">
  <div class="swatch"><div class="swatch-color" style="background:#ffffff;border-bottom:1px solid rgba(255,255,255,0.1)"></div><div class="swatch-label"><div class="name">White</div><div class="hex">#ffffff</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#f0f0f0"></div><div class="swatch-label"><div class="name">Gray 100</div><div class="hex">#f0f0f0</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#8a8a8a"></div><div class="swatch-label"><div class="name">Gray 400</div><div class="hex">#8a8a8a</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#3a3a3a"></div><div class="swatch-label"><div class="name">Charcoal</div><div class="hex">#3a3a3a</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#1a1a1a"></div><div class="swatch-label"><div class="name">Dark 900</div><div class="hex">#1a1a1a</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#0a0a0a"></div><div class="swatch-label"><div class="name">Darker</div><div class="hex">#0a0a0a</div></div></div>
</div>
</body></html>
