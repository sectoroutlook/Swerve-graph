<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); font-family: var(--font-body); padding: 20px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { flex: 1; min-width: 80px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
.swatch-color { height: 64px; }
.swatch-label { padding: 7px 9px; }
.name { font-size: 11px; font-weight: 600; color: var(--fg1); }
.hex  { font-size: 10px; color: var(--fg3); margin-top: 1px; }
</style>
</head><body>
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#9666e3"></div>
    <div class="swatch-label"><div class="name">Core Purple</div><div class="hex">#9666e3</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#1892f3"></div>
    <div class="swatch-label"><div class="name">Primary Blue</div><div class="hex">#1892f3</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#d1c4fc"></div>
    <div class="swatch-label"><div class="name">Soft Purple</div><div class="hex">#d1c4fc</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#cfe6fa"></div>
    <div class="swatch-label"><div class="name">Soft Blue</div><div class="hex">#cfe6fa</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#2c2c2e"></div>
    <div class="swatch-label"><div class="name">Neutral Black</div><div class="hex">#2c2c2e</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#f3f1f3; border-bottom:1px solid rgba(0,0,0,0.08)"></div>
    <div class="swatch-label"><div class="name">Base White</div><div class="hex">#f3f1f3</div></div>
  </div>
</div>
</body></html>
