<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWERVE UI Kit — swerve.wtf</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body, #root { height: 100%; }
body { background: #080714; }

/* Kit switcher bar */
.kit-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  background: rgba(6,5,18,0.97); backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; padding: 0 16px; height: 40px; gap: 0;
}
.kit-label { font-family: Poppins, sans-serif; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.28); margin-right: 14px; padding-right: 14px; border-right: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 7px; }
.kit-btn {
  background: none; border: none; color: rgba(255,255,255,0.35);
  font-family: Poppins, sans-serif; font-size: 11px; font-weight: 500;
  padding: 0 13px; height: 40px; cursor: pointer;
  border-bottom: 2px solid transparent; transition: all 140ms;
}
.kit-btn.active { color: #fff; border-bottom-color: #9666e3; }
.kit-btn:hover:not(.active) { color: rgba(255,255,255,0.7); }

/* Offset for both bars */
.page-wrap { padding-top: calc(40px + 56px); min-height: 100vh; }
/* When nav is inside page, shift only kit bar */
.page-wrap-nosubnav { padding-top: 40px; min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ResearchScreen.jsx"></script>
<script type="text/babel" src="ContactScreen.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="SignUpScreen.jsx"></script>

<script type="text/babel">
const SCREENS = ['Home', 'Research', 'Contact'];

function App() {
  const saved = localStorage.getItem('swerve-kit-v3');
  const [screen, setScreen] = React.useState(saved || 'Home');

  React.useEffect(() => {
    localStorage.setItem('swerve-kit-v3', screen);
    window.scrollTo(0, 0);
  }, [screen]);

  function renderScreen() {
    switch (screen) {
      case 'Home':     return <HomeScreen onNav={setScreen} />;
      case 'Research': return <ResearchScreen />;
      case 'Contact':  return <ContactScreen />;
      default:         return <HomeScreen onNav={setScreen} />;
    }
  }

  // Screens that include their own Nav
  const hasOwnNav = ['Home', 'Research', 'Contact'].includes(screen);

  return (
    <>
      {/* Kit picker bar */}
      <div className="kit-bar">
        <div className="kit-label">
          <img src="../../assets/watermark-gradient.png" height="18" alt="" />
          UI Kit
        </div>
        {SCREENS.map(s => (
          <button key={s} className={'kit-btn' + (screen === s ? ' active' : '')} onClick={() => setScreen(s)}>{s}</button>
        ))}
      </div>

      {/* Nav bar (actual site nav, shown for marketing pages) */}
      {hasOwnNav && <Nav active={screen} onNav={setScreen} />}

      {/* Page content */}
      <div className={hasOwnNav ? 'page-wrap' : 'page-wrap-nosubnav'}>
        {renderScreen()}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
